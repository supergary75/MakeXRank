name: Validate and package Tencent release

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "tencent-release"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run sync:inspire && npm run build:tencent
        env:
          VITE_BUILD_ID: ${{ github.sha }}

      - name: Package exact source and frontend
        run: node scripts/package-release.mjs

      - name: Retain deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: makexrank-tencent-${{ github.sha }}
          path: release/*.tar.gz
          retention-days: 30
