<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MakeX Inspire 成绩统计系统</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <script src="js/makexrank-config.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/supabase_sync.js"></script>
    <script src="js/shared_indexdb.js"></script>
    <script src="js/header.js"></script>

    <div class="container">
        <section id="section-stats">
            <div class="stats-grid">
                <div class="stat-card full">
                    <div class="card-header" style="margin-bottom: 0.5rem">
                        <span class="card-title">💪 基本功排名</span>
                    </div>
                    <div id="rankingBasic"></div>
                </div>
                <div class="stat-card full">
                    <div class="card-header" style="margin-bottom: 0.5rem">
                        <span class="card-title">🔥 挑战类排名</span>
                    </div>
                    <div id="challengeTaskFilter" style="margin-bottom:0.6rem;display:flex;flex-wrap:wrap;gap:0.4rem;align-items:center;"></div>
                    <div id="rankingChallenge"></div>
                </div>
            </div>
        </section>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/apps/stats.js"></script>
</body>
</html>
